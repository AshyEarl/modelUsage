[package]
name = "modelUsage"
version = "0.1.23"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
walkdir = "2.5"

# SQLite reader for OpenCode session DB (~/.local/share/opencode/opencode.db).
# `bundled` compiles the SQLite amalgamation shipped inside the crate, so the
# release binaries stay self-contained without a system libsqlite3.
# 用 bundled 编译随包自带的 SQLite 源码，release 产物不依赖系统 libsqlite3。
rusqlite = { version = "0.37", features = ["bundled"] }
